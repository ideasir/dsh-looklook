# dsh-looklook — look-at-anything plugin layer.
#
# Installed as a bundle: `dsh plugin --profile <name> add dsh-looklook`.
#
# Zero-patch architecture: the plugin exposes its settings namespaces through
# `llm.registerConfigurableProviders()` (api-proxy serves those automatically),
# routes dropped files through the authorized `remote.looklook.upload` RPC into
# the session `.uploads/`, and NEVER touches the native attachment pipeline or
# any `@deepseek-ai/*` source file. No prompt admission, no request rewriting,
# no harness patches — nothing here overrides DSH behavior beyond this row.
#
# Configuration defaults live in the row config below; the user layer in the
# `looklook` / `vision` / `looklook-audio` settings namespaces overrides them
# at runtime (hot reload).
- insert:
    - id: looklook
      name: dsh-looklook
      config:
        providers: []
        sessionOverrides: {}
        maxDescribeChars: 2000
